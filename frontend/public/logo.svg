<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B51F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- آیکون 6 -->
  <rect x="5" y="10" width="40" height="40" rx="12" fill="url(#grad1)"/>
  <text x="25" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="900" 
        fill="white" text-anchor="middle">6</text>
  
  <!-- متن SwagDirT -->
  <text x="52" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="18" 
        font-weight="800" fill="url(#grad2)">Swag</text>
  <text x="100" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="18" 
        font-weight="800" fill="#0B51F4">Dir</text>
  <text x="132" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="18" 
        font-weight="800" fill="url(#grad2)">T</text>
  
  <!-- زیرنویس -->
  <text x="100" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="8" 
        font-weight="500" fill="#888" text-anchor="middle" letter-spacing="2">FASHION</text>
</svg>